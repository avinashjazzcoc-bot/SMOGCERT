<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollution Certificate Reminder System</title>

    <!-- Your existing style.css -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Small compatibility styles for the Google Sheets version */
        .toolbar {
            display:flex;
            gap:12px;
            margin:18px 0;
            align-items:center;
        }

        .refresh-btn {
            border:0;
            border-radius:8px;
            padding:11px 20px;
            background:#1976d2;
            color:white;
            cursor:pointer;
            font-size:15px;
        }

        .refresh-btn:hover {
            background:#125eaa;
        }

        .message {
            min-height:22px;
            text-align:center;
            font-weight:600;
            margin:8px 0;
        }

        .status-pending,
        .status-done,
        .status-cant,
        .status-close,
        .status-updated {
            display:inline-block;
            padding:5px 9px;
            border-radius:12px;
            font-size:12px;
            font-weight:700;
        }

        .status-pending { background:#fff3cd; color:#856404; }
        .status-done { background:#d4edda; color:#155724; }
        .status-cant { background:#f8d7da; color:#721c24; }
        .status-close { background:#e2e3e5; color:#383d41; }
        .status-updated { background:#cce5ff; color:#004085; }

        .days-normal { font-weight:700; }
        .days-warning { color:#d97706; font-weight:800; }
        .days-today { color:#dc2626; font-weight:900; }
        .days-expired { color:#b91c1c; font-weight:900; }

        .action-buttons {
            display:flex;
            flex-wrap:wrap;
            gap:6px;
        }

        .action-buttons button {
            border:0;
            border-radius:6px;
            padding:8px 10px;
            color:white;
            cursor:pointer;
            font-size:12px;
        }

        .callDone { background:#198754; }
        .cantConnect { background:#dc3545; }
        .updateCase { background:#0d6efd; }
        .closeCase { background:#6c757d; }

        .action-buttons button:hover {
            opacity:.88;
        }

        .table-wrap {
            overflow-x:auto;
        }

        table {
            width:100%;
            border-collapse:collapse;
        }

        th, td {
            padding:12px 10px;
            text-align:left;
            border-bottom:1px solid #e5e7eb;
        }

        th {
            background:#1976d2;
            color:white;
        }

        tr:hover td {
            background:#f8fafc;
        }

        .search-box {
            width:100%;
            box-sizing:border-box;
            padding:13px 14px;
            border:1px solid #cbd5e1;
            border-radius:8px;
            font-size:16px;
        }

        .dashboard {
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            gap:18px;
        }

        .dashboard-card {
            background:white;
            border-radius:12px;
            padding:20px;
            text-align:center;
            box-shadow:0 3px 12px rgba(0,0,0,.10);
        }

        .dashboard-number {
            font-size:36px;
            font-weight:800;
            color:#1769aa;
        }

        .dashboard-label {
            margin-top:5px;
            font-size:16px;
        }

        @media (max-width:800px) {
            .dashboard {
                grid-template-columns:repeat(2, 1fr);
            }
        }

        @media (max-width:500px) {
            .dashboard {
                grid-template-columns:1fr;
            }

            th, td {
                white-space:nowrap;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>🚗 Pollution Certificate Reminder System</h1>
    <p>Upcoming Pollution Certificate Expiry (Next 10 Days)</p>
</header>

<main class="container">

    <section class="dashboard">

        <div class="dashboard-card">
            <div class="dashboard-number" id="totalVehicles">0</div>
            <div class="dashboard-label">Total Vehicles</div>
        </div>

        <div class="dashboard-card">
            <div class="dashboard-number" id="dueVehicles">0</div>
            <div class="dashboard-label">Due in 10 Days</div>
        </div>

        <div class="dashboard-card">
            <div class="dashboard-number" id="callDone">0</div>
            <div class="dashboard-label">Call Done</div>
        </div>

        <div class="dashboard-card">
            <div class="dashboard-number" id="cantConnect">0</div>
            <div class="dashboard-label">Can't Connect</div>
        </div>

    </section>

    <section class="controls">

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search Registration Number / Phone Number / Vehicle Name"
            autocomplete="off"
        >

        <div class="records-toolbar no-print">
<button type="button" id="upcomingView" class="records-btn active">🔔 Expired &amp; Soon Expiring</button>
<button type="button" id="vehicleRecordsView" class="records-btn">📋 Vehicle Records</button>
<button type="button" id="pdfButton" class="pdf-btn" style="display:none;">📄 Save All Data as PDF</button>
</div><div class="toolbar">
            <button
                type="button"
                id="refreshData"
                class="refresh-btn">
                🔄 Refresh Google Sheet
            </button>

            <div id="message" class="message"></div>
        </div>

    </section>

    <section class="table-card">

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Registration No</th>
                        <th>Phone</th>
                        <th>PUCC Expiry</th>
                        <th>Days Left</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="tableBody">

                    <tr>
                        <td colspan="6" style="text-align:center;">
                            Loading vehicles...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="script.js?v=20260816-3"></script>

</body>
</html>
